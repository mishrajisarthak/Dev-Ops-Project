global:
  environment: production

namespace: folio

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/jash2511/folio-backend
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  port: 8000
  env:
    APP_ENV: production
    DATABASE_URL: "postgresql+psycopg://folio:folio_secret@folio-postgres:5432/folio_db"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/jash2511/folio-frontend
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 101

postgres:
  enabled: true
  image: postgres:17-alpine
  database: folio_db
  user: folio
  password: folio_secret
  storage:
    size: 2Gi
    storageClass: ""

ingress:
  enabled: true
  className: traefik
  host: folio.local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

monitoring:
  serviceMonitor:
    enabled: false
    interval: 15s
    scrapeTimeout: 10s
