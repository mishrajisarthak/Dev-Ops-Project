apiVersion: apps/v1
kind: Deployment
metadata:
  name: folio-backend
  labels:
    app: folio-backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: folio
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: folio-backend
  template:
    metadata:
      labels:
        app: folio-backend
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.backend.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.backend.securityContext.runAsUser }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
              name: http
          env:
            - name: APP_ENV
              value: "{{ .Values.backend.env.APP_ENV }}"
            - name: DATABASE_URL
              value: "{{ .Values.backend.env.DATABASE_URL }}"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
