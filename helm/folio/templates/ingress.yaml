{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: folio-ingress
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: folio-backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: folio-backend
                port:
                  number: 8000
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: folio-backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: folio-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: folio-frontend
                port:
                  number: 80
{{- end }}
