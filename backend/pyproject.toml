[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-library-api"
version = "2.0.0"
description = "Folio library catalog, membership and circulation API"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.data-files]
"share/folio" = ["alembic.ini"]
"share/folio/alembic" = ["alembic/env.py"]
"share/folio/alembic/versions" = ["alembic/versions/*.py"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
