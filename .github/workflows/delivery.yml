name: Folio - test, package and publish

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API tests (SQLite and PostgreSQL) + Python packages
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: folio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U folio -d folio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt build pyyaml
      - name: Static and security checks
        run: |
          python -m ruff check backend/app backend/tests scripts
          python -m bandit -r backend/app -ll
          python scripts/check_workflow.py
      - name: SQLite tests
        working-directory: backend
        run: python -m pytest -v --junitxml=../docs/evidence/pytest-sqlite.xml
      - name: PostgreSQL tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://folio:ci_only_password@localhost:5432/folio_test
        run: python -m pytest -v --junitxml=../docs/evidence/pytest-postgres.xml
      - name: Apply migrations and seed twice
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://folio:ci_only_password@localhost:5432/folio_test
        run: |
          python -m app.migrate
          python -m app.seed
          python -m app.seed
      - name: Build wheel and source distribution
        run: python -m build backend --outdir packages
      - name: Verify installed wheel outside source tree
        run: |
          python -m pip install --no-deps packages/*.whl
          python scripts/verify_installed_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: folio-python-packages
          path: packages/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: docs/evidence/pytest-*.xml

  frontend:
    name: Frontend tests + production package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: mkdir -p ../packages && npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: folio-web-package
          path: |
            frontend/dist/
            packages/*.tgz

  integration:
    name: Container lifecycle + browser verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4.3.1
      - run: helm lint helm/folio
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: docker compose up --build --wait --wait-timeout 180
      - run: docker compose exec -T backend python -m app.seed
      - run: python scripts/smoke.py http://localhost:3000
      - run: python scripts/concurrency_test.py
      - run: python scripts/verify_persistence.py
      - run: python scripts/browser_test.py
      - name: Container logs
        if: always()
        run: docker compose logs --no-color > docs/evidence/compose-ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: docs/evidence/
      - if: always()
        run: docker compose down

  images:
    name: Build and scan ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs: [integration]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Image registry name
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${REPOSITORY_OWNER,,}/folio-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build for vulnerability scan
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: folio-${{ matrix.component }}:scan
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: folio-${{ matrix.component }}:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified images
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
